name: tests

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install fastapi httpx
      - name: JavaScript parses
        run: for f in javascript/*.js; do node --check "$f"; done
      - name: Checks
        run: python tests/run.py
